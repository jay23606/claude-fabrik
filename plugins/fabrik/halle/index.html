<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software-Fabrik</title>
<link rel="stylesheet" href="halle.css">
</head>
<body>
<!-- Kopfleiste über der Halle: Verbindungsmeldung und Update-Hinweis liegen untereinander
     und schieben die Halle nach unten, statt sie oder einander zu verdecken. -->
<div class="kopfleiste" id="kopfleiste">
  <p class="verbindung" id="verbindung" role="status" aria-live="polite"></p>
  <div class="update-banner" id="update" role="status" aria-live="polite" hidden>
    <p class="update-text"><strong id="update-titel"></strong> <span id="update-installiert"></span></p>
    <button class="kopieren klein update-befehl" id="update-befehl" type="button"></button>
    <p class="update-nachsatz">Im Terminal ausführen, danach Claude Code neu starten.</p>
    <button class="update-zu" id="update-zu" type="button" aria-label="Update-Hinweis schließen">×</button>
  </div>
</div>

<main class="halle-rahmen" id="halle-rahmen">
  <svg id="halle" viewBox="0 0 1600 960" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Fabrikhalle mit allen Aufträgen"></svg>
</main>

<!-- Ansagen für Screenreader, z. B. „Befehl kopiert“ -->
<p class="nur-vorlesen" id="ansage" role="status" aria-live="polite"></p>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<aside class="karte" id="karte" role="dialog" aria-modal="true" aria-labelledby="karte-titel" inert>
  <div class="karte-kopf">
    <div>
      <div class="karte-id" id="karte-id"></div>
      <h2 id="karte-titel"></h2>
    </div>
    <button class="schliessen" id="karte-zu" aria-label="Infokarte schließen">×</button>
  </div>
  <button class="kopieren" id="karte-kopieren" type="button"></button>
  <div class="karte-inhalt" id="karte-inhalt"></div>
</aside>
<div class="schleier" id="schleier" hidden></div>

<script src="halle.js"></script>
</body>
</html>
